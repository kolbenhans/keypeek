name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: os
    attributes:
      label: OS / Distro
      placeholder: e.g. Arch Linux, Wayland
  - type: input
    id: keyboard
    attributes:
      label: Keyboard / Protocol
      placeholder: e.g. Sofle, Vial
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
